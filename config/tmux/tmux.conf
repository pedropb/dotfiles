# tmux loads every default config file it finds and the last one wins; this file
# is the last. Layer on top of a host-provided config when there is one (`-q`
# makes the source a no-op otherwise), then override it below.
source-file -q ~/.local/share/omarchy/config/tmux/tmux.conf

# tmux seeds default-shell from $SHELL, which login(1) copies out of the user
# database — bash on hosts whose account predates zsh. Neither layer below the
# compositor can correct that variable (systemd's environment.d only adds
# variables it does not already have, and uwsm strips SHELL outright), so name
# the shell here. default-command stays empty, so tmux still starts it as a
# login shell and ~/.zprofile is read. Both guards miss => fall back to $SHELL.
if-shell '[ -x /bin/zsh ]' 'set -g default-shell /bin/zsh'
if-shell '[ -x /usr/bin/zsh ]' 'set -g default-shell /usr/bin/zsh'

# 0 is too far from ` ;)
set -g base-index 1
setw -g pane-base-index 1

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

#set -g default-terminal screen-256color
set -g status-keys vi
set -g history-limit 10000

setw -g mode-keys vi
setw -g mouse on
setw -g monitor-activity on

bind-key x kill-pane

bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v clip.exe >/dev/null 2>&1; then clip.exe; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard; else tmux load-buffer -; fi"

bind-key -T copy-mode-vi u send-keys -X halfpage-up
bind-key -T copy-mode-vi d send-keys -X halfpage-down

bind-key c new-window -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"

bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R

# Vim style pane selection.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt-arrows are left to the host config; M-h/j/k/l above already covers
# prefix-less pane selection.

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config.
bind r source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"

