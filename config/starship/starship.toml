# A compact two-line prompt using WezTerm's bundled Nerd Font symbols.
add_newline = true
palette = "catppuccin_mocha"
format = """
[╭─](bold blue) $directory$git_branch$git_status$nodejs$python$rust$golang$cmd_duration
[╰─](bold blue)$character"""

[palettes.catppuccin_mocha]
blue = "#89b4fa"
teal = "#94e2d5"
green = "#a6e3a1"
yellow = "#f9e2af"
peach = "#fab387"
red = "#f38ba8"
mauve = "#cba6f7"
overlay = "#7f849c"

[directory]
style = "bold blue"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "
read_only_style = "red"

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
modified = "!${count} "
staged = "+${count} "
untracked = "?${count} "
stashed = "≡${count} "
deleted = "✘${count} "

[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "bold yellow"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "bold peach"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold teal"
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 2_000
style = "bold overlay"
format = "[󰔛 $duration]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"
